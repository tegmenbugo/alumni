version: '3.8'

services:
  # -------------------------------------------------------------
  # WEB UYGULAMASI (PHP 8.3 + Apache + MVC Router)
  # -------------------------------------------------------------
  web:
    build: .
    container_name: alumni_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    environment:
      - APP_NAME=${APP_NAME:-Alumni Tracking System}
      - APP_ENV=${APP_ENV:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - DB_DATABASE=${DB_DATABASE:-/var/www/html/data/alumni.sqlite}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-alumni_db}
      - DB_USERNAME=${DB_USERNAME:-alumni_user}
      - DB_PASSWORD=${DB_PASSWORD:-alumni_secret_password}
    volumes:
      - .:/var/www/html
      - ./data:/var/www/html/data
    depends_on:
      - db

  # -------------------------------------------------------------
  # VERİTABANI SERVİSİ (MySQL 8.0 - Görev 3)
  # Kalıcı Veri Hacmi (Volume) ile "The Forgetting Test" Korumalı
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: alumni_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE_NAME:-alumni_db}
      MYSQL_USER: ${DB_USERNAME:-alumni_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-alumni_secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-alumni_root_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # MySQL verilerinin konteyner silinse dahi korunmasını sağlayan Docker Volume
  db_data:
    driver: local
